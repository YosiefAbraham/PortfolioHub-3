<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft background circle -->
  <circle cx="200" cy="200" r="180" fill="#f0f4f8" opacity="0.5"/>
  
  <!-- Main decorative element - simplified Studio Ghibli style -->
  <circle cx="200" cy="200" r="150" fill="#e8f5e9" stroke="#81c784" stroke-width="3" opacity="0.8"/>
  
  <!-- Whimsical details -->
  <path d="M 200 100 Q 230 120, 200 140 Q 170 120, 200 100 Z" fill="#a5d6a7" opacity="0.6"/>
  <path d="M 150 200 Q 170 230, 200 200 Q 170 170, 150 200 Z" fill="#c8e6c9" opacity="0.6"/>
  <path d="M 250 200 Q 230 170, 200 200 Q 230 230, 250 200 Z" fill="#c8e6c9" opacity="0.6"/>
  
  <!-- Center element -->
  <circle cx="200" cy="200" r="40" fill="#66bb6a" opacity="0.7"/>
  <circle cx="200" cy="200" r="25" fill="#ffffff" opacity="0.9"/>
  
  <!-- Soft accent strokes -->
  <path d="M 200 50 Q 200 100, 180 120" stroke="#81c784" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 200 50 Q 200 100, 220 120" stroke="#81c784" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>



