<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- First Gen Scholars Logo - Simplified cartoon version - ENLARGED & MORE VIBRANT -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Open book - BIGGER -->
  <g transform="translate(200, 200) scale(1.6)">
    <!-- Left page -->
    <path d="M -80 -30 Q -80 -40, -70 -40 L -5 -40 L -5 40 L -70 40 Q -80 40, -80 30 Z" 
          fill="#2874A6"/>
    
    <!-- Right page -->
    <path d="M 5 -40 L 70 -40 Q 80 -40, 80 -30 L 80 30 Q 80 40, 70 40 L 5 40 Z" 
          fill="#2874A6"/>
    
    <!-- Book spine -->
    <rect x="-5" y="-40" width="10" height="80" fill="#1B4F72"/>
    
    <!-- Pages detail -->
    <line x1="-60" y1="-20" x2="-15" y2="-20" stroke="white" stroke-width="2.5" opacity="0.8"/>
    <line x1="-60" y1="-5" x2="-15" y2="-5" stroke="white" stroke-width="2.5" opacity="0.8"/>
    <line x1="-60" y1="10" x2="-15" y2="10" stroke="white" stroke-width="2.5" opacity="0.8"/>
    
    <line x1="15" y1="-20" x2="60" y2="-20" stroke="white" stroke-width="2.5" opacity="0.8"/>
    <line x1="15" y1="-5" x2="60" y2="-5" stroke="white" stroke-width="2.5" opacity="0.8"/>
    <line x1="15" y1="10" x2="60" y2="10" stroke="white" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Graduation cap on top - BIGGER -->
    <g transform="translate(0, -75)">
      <rect x="-40" y="0" width="80" height="10" rx="2" fill="#F39C12"/>
      <polygon points="0,-18 -18,0 18,0" fill="#F39C12"/>
      <line x1="18" y1="-9" x2="33" y2="-18" stroke="#F39C12" stroke-width="4"/>
      <circle cx="33" cy="-18" r="5" fill="#F39C12"/>
    </g>
  </g>
</svg>
